baseURL = "https://example.com/"
languageCode = "en-us"
title = "Fixlog"
theme = "fixlog"
enableRobotsTXT = true
capitalizeListTitles = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "A personal dev log: generative AI, coding, and whatever I'm shipping this week. Real experiments, real failures."
  author = "Sassi"
  footer = "Personal and unofficial. Not affiliated with FixByte."
  avatar = "images/avatar.webp"
  authorRole = "Builder, breaker, note-taker"
  # version = "v0.1"   # optional chip next to the logo

[menus]
  [[menus.main]]
    identifier = "home"
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "log"
    name = "Log"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    identifier = "archive"
    name = "Archive"
    pageRef = "/archive"
    weight = 30
  [[menus.main]]
    identifier = "status"
    name = "Status"
    pageRef = "/status"
    weight = 40

[markup.highlight]
  noClasses = false
  style = "github-dark"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[markup.goldmark.renderer]
  unsafe = false
