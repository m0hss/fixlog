baseURL = "https://fixlog.run/"
languageCode = "en-us"
title = "Fixlog"
theme = "fixlog"
enableRobotsTXT = true
capitalizeListTitles = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "A personal engineering notebook: generative AI experiments, Linux and GNOME tinkering, and whatever I'm shipping this week. Wins, dead ends, and what I learned from both."
  author = "Sassi"
  avatar = "images/avatar.svg"
  manifest = "manifest.webmanifest"
  repo = "https://github.com/m0hss/fixlog"   # footer GitHub icon; remove to hide
  publicURL = "https://fixlog.run/"          # shown in the footer curl line, also under hugo server
  # footer = "..."                           # optional small line under the footer
  authorRole = "Builder, breaker, note-taker"
  # version = "v0.1"   # optional chip next to the logo

[menus]
  [[menus.main]]
    identifier = "home"
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "log"
    name = "Log"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    identifier = "archive"
    name = "Archive"
    pageRef = "/archive"
    weight = 30
  [[menus.main]]
    identifier = "status"
    name = "Status"
    pageRef = "/status"
    weight = 40

[markup.highlight]
  noClasses = false
  style = "github-dark"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[markup.goldmark.renderer]
  unsafe = false
